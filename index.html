<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Manuel Martínez</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/interactions.js" defer></script>
</head>
<body>

  <noscript>
    <p class="noscript">Activa JavaScript en tu navegador para ver el contenido del CV.</p>
  </noscript>

  <div class="toolbar">
    <button type="button" id="btn-print" class="btn">Imprimir / Guardar PDF</button>
  </div>

  <div class="page">

    <header>
      <h1 id="cv-name"></h1>
      <p class="headline" id="cv-headline"></p>
      <div class="contact" id="cv-contact"></div>
    </header>

    <div class="body-grid">
      <main id="cv-main"></main>
      <aside class="side" id="cv-side"></aside>
    </div>

    <footer id="cv-footer"></footer>

  </div>

</body>
</html>
